name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Runs on every push to main: opens/updates a release PR, or — when a
  # pending release-please PR was just merged — creates the tag + GitHub
  # Release directly. release-type "simple" means changelog + tag only —
  # there is no per-language version file for release-please to bump;
  # MinVer (see Tamga.Sdk.csproj) derives the actual NuGet package version
  # from that tag at `dotnet pack` time. See CLAUDE.md "Versioning & Release".
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Mint a short-lived installation token for the tamga-release-bot
      # GitHub App and hand it to release-please below, so the release PR is
      # authored by the App instead of the default GITHUB_TOKEN. GitHub
      # refuses to trigger workflows from GITHUB_TOKEN-authored events
      # (loop prevention), so CI never ran on the release PR, the required
      # status checks that branch protection on main demands never appeared,
      # and every release so far needed an admin override to merge.
      # App-authored PRs do trigger workflows, so ci.yml now runs normally.
      #
      # Scope this token to the release-please step ONLY — never as a job- or
      # workflow-level env var. The publish job authenticates to NuGet.org
      # via OIDC Trusted Publishing using the workflow's own identity and its
      # id-token: write permission; it must not pick this token up.
      - uses: actions/create-github-app-token@v2
        id: app-token
        timeout-minutes: 10
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        timeout-minutes: 10
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only right after release-please's own step above actually created
  # a release (i.e. this run was the release-PR-merge push) — packs and
  # pushes the resulting version to NuGet.org.
  #
  # Deliberately gated via this job's `needs`/`if` on the release-please
  # job's output, in the SAME workflow run, rather than a separate
  # `on: release: types: [published]` trigger: release-please-action
  # creates that GitHub Release using this workflow's own GITHUB_TOKEN,
  # and GitHub does not let GITHUB_TOKEN-authored events trigger further
  # workflow runs (loop-prevention) — so a `release: published` trigger
  # here would simply never fire. See googleapis/release-please-action's
  # README "Configuring Release Please" section (same-job output pattern).
  publish:
    name: publish to NuGet
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # A job-level `permissions:` block replaces the workflow-level
      # default for that job rather than adding to it — contents: read is
      # required here for actions/checkout to work at all, it is not
      # inherited from the top-level `contents: write`.
      contents: read
      id-token: write # required to request the GitHub OIDC token for NuGet.org Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          fetch-depth: 0 # MinVer needs full history to find the just-created tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        timeout-minutes: 10
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tamga.sln
        timeout-minutes: 10

      - name: Pack
        # MinVer reads the tag from the release that triggered this job and
        # stamps the resulting .nupkg with the correct version automatically.
        run: dotnet pack src/Tamga.Sdk/Tamga.Sdk.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC → short-lived API key)
        # Trusted Publishing: exchanges this job's GitHub OIDC token for a
        # ~1-hour NuGet.org API key, validated against the trust policy
        # registered at nuget.org (Package Owner: Tamga, Repository Owner:
        # tamga-sh, Repository: tamga-dotnet, Workflow File: release.yml).
        # No long-lived secret stored in this repo — see CLAUDE.md
        # "Publishing Method".
        uses: NuGet/login@v1
        id: login
        timeout-minutes: 10
        with:
          # Must be the nuget.org username of the account that CREATED the
          # trust policy (the "policy creator"), NOT the Package Owner
          # ("Tamga") selected inside that policy — nuget.org's OIDC token
          # exchange looks up policies by creator account and returned
          # HTTP 401 "No matching trust policy owned by user 'Tamga'" until
          # this was corrected.
          user: necipsunmaz

      - name: Push to NuGet.org
        timeout-minutes: 10
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
